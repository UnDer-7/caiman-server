<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Link not found</title>
    <style>
        :root { color-scheme: light dark; --bg: #ffffff; --fg: #1a1a1a; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #121212; --fg: #e8e8e8; }
        }
        body { font-family: system-ui, sans-serif; max-width: 480px; margin: 4rem auto; padding: 0 1rem; color: var(--fg); background: var(--bg); text-align: center; }
        h1 { font-size: 1.25rem; }
    </style>
</head>
<body>
    <h1>Link not found</h1>
    <p>This payment link is invalid or no longer exists. Please check the link from your email, or contact the person who sent it to you.</p>
</body>
</html>
